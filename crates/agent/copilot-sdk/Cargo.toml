[package]
name = "cowboy-agent-copilot-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "copilot-sdk-test-runtime"
path = "tests/support/runtime.rs"
required-features = ["sdk"]
test = false

[features]
default = []
sdk = ["dep:copilot-sdk", "dep:anyhow", "dep:async-trait", "dep:cowboy-agent-client", "dep:serde_json", "dep:tokio", "dep:libc"]

[dependencies]
copilot-sdk = { version = "=2.0.1", default-features = false, optional = true }
cowboy-agent-client = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process", "rt", "sync", "time", "macros"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
cowboy-log.workspace = true
tempfile.workspace = true
