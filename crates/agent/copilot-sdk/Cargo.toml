[package]
name = "cowboy-agent-copilot-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "copilot-sdk-test-runtime"
path = "tests/support/runtime.rs"
test = false

[dependencies]
copilot-sdk = { version = "=2.0.1", default-features = false }
cowboy-agent-client.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "time", "macros"] }
libc = "0.2"

[dev-dependencies]
cowboy-log.workspace = true
tempfile.workspace = true
