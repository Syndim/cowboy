[package]
name = "cowboy-agent-codex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cowboy-agent-client.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "codex-mock-server"
path = "src/bin/mock_server.rs"
