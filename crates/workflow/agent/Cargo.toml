[package]
name = "cowboy-workflow-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent action execution helpers for Cowboy workflows"

[features]
test-support = []
# Test-app backends for `execute-agent`; library code never references concrete
# agent protocols.
cli-backends = ["dep:cowboy-agent-acp"]

[dependencies]
cowboy-agent-client.workspace = true
cowboy-agent-acp = { workspace = true, optional = true }
cowboy-workflow-core.workspace = true
cowboy-workflow-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
blake3 = "1"
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
parking_lot.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "time"] }
